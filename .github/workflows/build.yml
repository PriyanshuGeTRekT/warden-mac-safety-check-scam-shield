name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ github.event.repository.name }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ github.event.repository.name }}-

      - name: Build
        run: swift build -c release

      - name: Unit tests
        run: swift test --skip "LiveTests"
